spring.config.import=optional:file:.env[.properties]

spring.mvc.dispatch-options-request=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://accounts.google.com


##
oauth.client-id=${GOOGLE_CLIENT_ID}
oauth.client-secret=${GOOGLE_CLIENT_SECRET}
oauth.redirect-url=${REDIRECT_URL}
oauth.token-secret=${TOKEN_SECRET}
oauth.token-expiration=36000
app.client.url=${CLIENT_URL:http://localhost:3000}
