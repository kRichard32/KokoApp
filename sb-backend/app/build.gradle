plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.3'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.Koko'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
	implementation("jakarta.validation:jakarta.validation-api:3.1.1")
	implementation("org.apache.commons:commons-lang3:3.18.0")
	implementation 'commons-io:commons-io:2.19.0'
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
	implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'

	// Google Drive API dependencies - Updated to compatible versions
	implementation('com.google.apis:google-api-services-drive:v3-rev20240914-2.0.0') {
		exclude group: 'commons-logging', module: 'commons-logging'
	}
	implementation('com.google.api-client:google-api-client:2.7.0') {
		exclude group: 'commons-logging', module: 'commons-logging'
	}
	implementation('com.google.oauth-client:google-oauth-client-jetty:1.36.0') {
		exclude group: 'commons-logging', module: 'commons-logging'
	}
	implementation('com.google.auth:google-auth-library-oauth2-http:1.28.0') {
		exclude group: 'commons-logging', module: 'commons-logging'
	}
	
	// Google Cloud Speech API - Use BOM for version management
	implementation platform('com.google.cloud:libraries-bom:26.52.0')
	implementation 'com.google.cloud:google-cloud-speech'
	
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	runtimeOnly 'org.postgresql:postgresql'
}

tasks.named('test') {
	useJUnitPlatform()
}
